<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ostinato</title>
  <style>
    :root { --bg: #111214; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg: #bdbcb5; color-scheme: light; } }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <!--
    Hosts Ostinato's views and shows one at a time: Sequencer, Sound Lab, Capture and Instruments
    (for now, the microKORG XL editor). All stay loaded, so the sequencer keeps playing, Capture
    keeps capturing and the XL editor keeps following the synth while you switch.
    The pages ask to switch with postMessage({ type: 'switch-view', view }) and are told which
    view is showing with { type: 'view', view }.
  -->
  <iframe id="sequencer" title="Sequencer" allow="midi" hidden></iframe>
  <iframe id="lab" title="Sound Lab" allow="midi" hidden></iframe>
  <iframe id="capture" title="Capture" allow="midi; microphone" hidden></iframe>
  <iframe id="instruments" title="Instruments: microKORG XL" allow="midi" hidden></iframe>
  <script>
    // The travel version (anywhere but this Mac's own server; see js/core/mode.js) has no XL
    // editor: it needs the synth and the server. It works offline once loaded (sw.js).
    const STATIC = new URLSearchParams(location.search).has('static') || !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    const frames = Object.fromEntries(['sequencer', 'lab', 'capture', 'instruments'].map(id => [id, document.getElementById(id)]));
    if (STATIC) {
      frames.instruments.remove();
      delete frames.instruments;
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    // A fresh address each time, so a browser never restores an out-of-date copy of a page.
    const fresh = `${location.search ? `${location.search}&` : '?'}v=${Date.now()}`;
    const pages = { sequencer: 'sequencer.html', lab: 'lab.html', capture: 'recorder.html', instruments: 'editor.html' };
    for (const [id, f] of Object.entries(frames)) f.src = `${pages[id]}${fresh}`;
    // Older names for the views (bookmarks, and pages that still ask for them).
    const ALIASES = { editor: 'instruments', recorder: 'capture' };
    let current = null, previous = 'sequencer';

    function show(view) {
      view = ALIASES[view] || view;
      if (!frames[view]) view = 'sequencer';
      if (view !== current && current) previous = current;
      current = view;
      for (const [name, frame] of Object.entries(frames)) frame.hidden = name !== view;
      history.replaceState(null, '', `${location.search}#${view}`);
      frames[view].contentWindow.focus();
      for (const f of Object.values(frames)) f.contentWindow?.postMessage({ type: 'view', view }, location.origin);
      syncTitle();
    }

    // The tab shows the visible page's title (e.g. the song name and its unsaved mark).
    function syncTitle() {
      try { document.title = frames[current].contentDocument.title || 'Ostinato'; } catch { /* still loading */ }
    }
    setInterval(syncTitle, 1000);

    addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      // toggle: Capture's shortcut (⌥R) goes there, or back to where you were.
      if (e.data?.type === 'switch-view') show(e.data.toggle && (ALIASES[e.data.view] || e.data.view) === current ? previous : e.data.view);
      else if (e.data?.type === 'view-hello') e.source?.postMessage({ type: 'view', view: current }, location.origin); // a page loaded
    });
    addEventListener('hashchange', () => show(location.hash.slice(1)));
    for (const frame of Object.values(frames)) frame.addEventListener('load', syncTitle);
    show(location.hash.slice(1));
  </script>
</body>
</html>
